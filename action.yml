name: Debtgate
description: Jev-powered technical debt gate on pull requests
author: jev-debtgate

inputs:
  api-key:
    description: Your TypeSafe API key (never a committed secret)
    required: true
  base:
    description: git diff base (commit SHA or ref)
    required: false
    default: HEAD^
  command:
    description: diff | gate
    required: false
    default: diff
  collect-only:
    description: "If true, skip Jev (collectors only)"
    required: false
    default: "false"
  shadow:
    description: "If true, print the verdict but always exit 0"
    required: false
    default: "true"
  fail-open:
    description: "If true, Jev outages become review + exit 0"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Build Debtgate
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install
        npm run build
    - name: Run Debtgate
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.api-key }}
      run: |
        if [ -z "${TYPESAFE_API_KEY}" ]; then
          echo "api-key input is empty. Set secrets.TYPESAFE_API_KEY to YOUR key."
          exit 3
        fi
        CMD="${{ inputs.command }}"
        BASE="${{ inputs.base }}"
        EXTRA=""
        if [ "${{ inputs.collect-only }}" = "true" ]; then
          EXTRA="$EXTRA --collect-only"
        fi
        if [ "${{ inputs.shadow }}" = "true" ]; then
          EXTRA="$EXTRA --shadow"
        fi
        if [ "${{ inputs.fail-open }}" = "true" ]; then
          EXTRA="$EXTRA --fail-open"
        fi
        node "${{ github.action_path }}/dist/cli.js" "$CMD" --base "$BASE" --format github $EXTRA
